[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "technocore-contribution-mapper"
version = "0.2.0"
description = "Correlate public GitHub evidence with public Technocore room messages, without overclaiming."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tunneelly" }]
keywords = ["technocore", "did", "evidence", "github"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
proof = ["cryptography>=42"]

[project.scripts]
contribution-mapper = "contribution_mapper.__main__:main"
contribution-mapper-ui = "contribution_mapper.ui:main"

[project.urls]
Repository = "https://github.com/Tunneelly/technocore-contribution-mapper"

[tool.setuptools.packages.find]
where = ["src"]
