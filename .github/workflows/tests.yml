name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
        extras: ["proof"]
        include:
          # Core-only run: proves the stdlib-only path works and the
          # crypto-dependent tests skip instead of failing.
          - python-version: "3.12"
            extras: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ matrix.extras }}" ]; then
            pip install ".[${{ matrix.extras }}]"
          else
            pip install .
          fi
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: contribution-mapper --help
